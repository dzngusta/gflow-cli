name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Write scopes live at JOB level (Scorecard Token-Permissions: workflow-level
# write grants every job — current and future — the elevated token).
permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      # The Release is created with RELEASE_PAT, not GITHUB_TOKEN, so nothing in this
      # job needs contents:write any more — checkout is persist-credentials:false and
      # PyPI uses OIDC. Least privilege: GITHUB_TOKEN gets no write grant here at all.
      contents: read
      id-token: write # for PyPI Trusted Publishing (OIDC)
    environment:
      name: pypi
      url: https://pypi.org/p/gflow-cli
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      NODE_VERSION: '22'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # This is the one workflow that publishes artefacts (PyPI + GitHub
          # Release), so it must not restore a cache any other workflow can
          # write: a poisoned entry would reach a signed release. Releases are
          # rare; the cold resolve costs seconds (zizmor: cache-poisoning).
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify tag is signed
        run: |
          TAG=${GITHUB_REF_NAME}
          # Lightweight tags resolve directly to a commit, not a tag object.
          TYPE=$(git cat-file -t "$TAG")
          if [ "$TYPE" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag. Use 'git tag -s' to create a signed annotated tag."
            exit 1
          fi
          # Annotated but unsigned tags have no signature header in the object.
          if ! git cat-file -p "$TAG" | grep -qE "BEGIN (PGP|SSH) SIGNATURE"; then
            echo "::error::$TAG is not signed. Use 'git tag -s' when cutting releases."
            exit 1
          fi

      - name: Verify tag matches pyproject version
        run: |
          TAG=${GITHUB_REF_NAME#v}
          PROJ_VERSION=$(grep -E '^version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          if [ "$TAG" != "$PROJ_VERSION" ]; then
            echo "::error::Tag ($TAG) does not match pyproject.toml version ($PROJ_VERSION)"
            exit 1
          fi

      - name: RELEASE_PAT must be present
        # The one silent regression path back to #841. If the secret is deleted or
        # renamed, `secrets.RELEASE_PAT` is the empty string; an action that falls back
        # to its default token would then create the Release under GITHUB_TOKEN, the
        # registry publish would never start, and every step would still be green.
        # Fail here instead, where the reason is written down.
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_PAT}" ]; then
            echo "::error::RELEASE_PAT is unset or empty. A Release created with the default GITHUB_TOKEN starts no workflow runs, so the MCP Registry publish would silently not run (#841)."
            exit 1
          fi
          echo "RELEASE_PAT is present."

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        # No api-token needed — uses OIDC Trusted Publishing.
        # Configure once at https://pypi.org/manage/account/publishing/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          # NOT the default GITHUB_TOKEN. GitHub starts no workflow runs from events
          # created with it, so a Release made under GITHUB_TOKEN never fired
          # `mcp-registry.yml`'s `release: published` trigger — zero runs, ever, across
          # every release that shipped with #829 (#841). A user-owned PAT makes the
          # event count as user-created, which is what starts the registry publish.
          #
          # RELEASE_PAT is a fine-grained PAT scoped to this repo with Contents:
          # read+write and NOTHING else. Fine-grained tokens expire (366 days max).
          #
          # An EXPIRED token fails loud: this step 401s and the job goes red, so no
          # Release exists. Note it fails AFTER the PyPI upload, which has no
          # `skip-existing` — do not re-run the workflow, create the Release by hand
          # (`gh release create`). See RELEASE.md § If the release job fails after PyPI.
          # A MISSING token is the silent one, which is why the step above guards it.
          token: ${{ secrets.RELEASE_PAT }}
          generate_release_notes: true
          files: dist/*
          # Pre-release detection covers both conventions:
          #   - semver suffixes:  v1.2.3-alpha1, v1.2.3-rc1, v1.2.3-beta1   (any '-' qualifies)
          #   - PEP 440 suffixes: v1.2.3a1, v1.2.3b1, v1.2.3rc1             (any 'a' / 'b' / 'rc')
          # Stable tags like v1.2.3 contain none of these substrings.
          prerelease: ${{ contains(github.ref_name, '-') || contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
